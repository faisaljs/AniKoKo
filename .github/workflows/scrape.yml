name: Aniflix Automated Scraper

on:
  schedule:
    # Runs every 6 hours automatically. Staggered to :15 to avoid peak GitHub Actions traffic
    - cron: '15 */6 * * *'
  workflow_dispatch:

concurrency:
  group: aniflix-scrape-job
  cancel-in-progress: false

# Restrict default permissions for maximum safety
permissions:
  contents: read

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Includes lxml to support HTML parsing in BeautifulSoup
          pip install --no-cache-dir httpx beautifulsoup4 tenacity lxml

      - name: Run Scraper and Update Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: "."
        run: |
          python scripts/collect.py
